[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cmsis-developer-assistant-tools"
dynamic = ["version"]
description = "Tools for the CMSIS Developer Assistant: check and build the knowledge a CMSIS pack ships"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Matthias Hertel" }]
keywords = ["CMSIS", "CMSIS-Pack", "Cortex-M", "knowledge", "MCP", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cmsis-knowledge = "cmsis_knowledge.cli:main"

[project.urls]
Homepage = "https://github.com/MatthiasHertelArm/cmsis-developer-assistant-tools"
Issues = "https://github.com/MatthiasHertelArm/cmsis-developer-assistant-tools/issues"
Changelog = "https://github.com/MatthiasHertelArm/cmsis-developer-assistant-tools/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/cmsis_knowledge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cmsis_knowledge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
